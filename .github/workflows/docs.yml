name: Docs
# Markdown lint, link check, and the agent-context Context Pin check.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * 1"
permissions:
  contents: read
jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: "**/*.md"
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A 5xx from github.com has failed this check for links that were fine.
      # If the first run fails, wait and run once more; the job takes the
      # second run's result, so a dead link still fails (Danny, 2026-11-25).
      - name: Check links
        id: first
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --accept 200,206
            "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait before the second run
        if: steps.first.outcome == 'failure'
        run: sleep 60
      - name: Check links again
        if: steps.first.outcome == 'failure'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --accept 200,206
            "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  context-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the agent-context Context Pin and lint AGENTS.md
        run: bash scripts/check-context-pin.sh
      - name: Prove the pin check refuses a tampered pin
        run: bash scripts/test-check-context-pin.sh
