name: CI
# Format, lint, typecheck, test and build the TypeScript workspace.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Build once (ADR 008). Format reads no build output, so it goes first.
      # --ignore-scripts skips the pretypecheck and pretest builds, which would
      # repeat this one, and still runs typecheck and test themselves.
      - name: Format
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run --ignore-scripts typecheck
      - name: Test
        run: npm test --ignore-scripts
      - name: Plain Workers runtime smoke
        run: npm run smoke:workers
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Dependency vulnerability check (high and critical fail)
        run: npm audit --audit-level=high
