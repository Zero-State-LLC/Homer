name: CI
# Format, lint, typecheck, test and build the TypeScript workspace.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and both parents, so ci-changes.sh can list the change.
          fetch-depth: 2
          persist-credentials: false
      - name: Prove the docs-only classifier fails toward running
        run: bash scripts/test-ci-changes.sh
      # Only a docs-only pull request skips the workspace steps (ADR 009). Each
      # condition tests != 'false', so a missing output runs everything.
      - name: Classify the change
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci-changes.sh
      # One product version (versioning spec, ADR 012). These read files with
      # the runner's own Node and install nothing, so they run for every pull
      # request, docs-only ones included.
      - name: Versions
        run: |
          node scripts/check-versions.mjs
          node --test scripts/check-versions.test.mjs scripts/deploy-check.test.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.workspace != 'false'
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.workspace != 'false'
        run: npm ci --no-audit --no-fund
      # Build once (ADR 008). Format reads no build output, so it goes first.
      # --ignore-scripts skips the pretypecheck and pretest builds, which would
      # repeat this one, and still runs typecheck and test themselves.
      - name: Format
        if: steps.changes.outputs.workspace != 'false'
        run: npm run format:check
      - name: Build
        if: steps.changes.outputs.workspace != 'false'
        run: npm run build
      - name: Lint
        if: steps.changes.outputs.workspace != 'false'
        run: npm run lint
      - name: Typecheck
        if: steps.changes.outputs.workspace != 'false'
        run: npm run --ignore-scripts typecheck
      - name: Test
        if: steps.changes.outputs.workspace != 'false'
        run: npm test --ignore-scripts
      - name: Plain Workers runtime smoke
        if: steps.changes.outputs.workspace != 'false'
        run: npm run smoke:workers
  admin-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and both parents, so ci-changes.sh can list the change.
          fetch-depth: 2
          persist-credentials: false
      # The same docs-only rule as `check` (ADR 009, CI feedback spec).
      - name: Classify the change
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci-changes.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.workspace != 'false'
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.workspace != 'false'
        run: npm ci --no-audit --no-fund
      - if: steps.changes.outputs.workspace != 'false'
        run: npm run build
      - name: Install pinned Playwright Chromium
        if: steps.changes.outputs.workspace != 'false'
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify admin journeys against local Worker
        if: steps.changes.outputs.workspace != 'false'
        env:
          ADMIN_SCREENSHOT_DIR: ${{ runner.temp }}/homer-admin-screenshots
        run: npm run smoke:admin
      - name: Retain synthetic admin screenshots
        if: steps.changes.outputs.workspace != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-fixture-screenshots
          path: ${{ runner.temp }}/homer-admin-screenshots
          if-no-files-found: error
          retention-days: 7
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Dependency vulnerability check (high and critical fail)
        run: npm audit --audit-level=high
