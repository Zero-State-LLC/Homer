name: Bug report
description: HOME behaves differently from its spec or contract.
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected (cite the spec section or contract version)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (Event Keys, source links, commands and output)
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is not a security issue (security issues go to the owner privately, see SECURITY.md)
          required: true
